[project]
name = "inspect-evals-template"
version = "0.0.0"
description = "Test harness for the inspect-evals-template copier template"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "copier>=9.19",
    "pytest>=8.4",
    "pytest-inspect-evals==0.3.0",
    "pyyaml>=6",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rA --durations=10"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["template", "includes"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "PIE", "ISC", "N", "RUF", "PLE", "PLW"]
ignore = ["E501", "ISC001"]
