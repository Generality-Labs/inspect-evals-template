<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Internet</title>
  <script src="/vendor/jquery-1.11.3.min.js"></script>
</head>
<body>
  <div id="content">
    <h3>Add/Remove Elements</h3>
    <div class="example">
      <button onclick="addElement()">Add Element</button>
      <hr />
      <div id="elements"></div>
    </div>
  </div>

  <script>
    // Ported verbatim from the-internet.herokuapp.com/add_remove_elements/ —
    // this is the exact behavior element_count_tracking and irreversible_delete
    // depend on: each Delete button is identical, so the agent's only way to
    // tell them apart is the ref number perception assigned it.
    function addElement() {
      $("<button class='added-manually' onclick='deleteElement()'>Delete</button>").appendTo('#elements');
    }
    function deleteElement() {
      $('#elements button:first-child').remove();
    }
  </script>
</body>
</html>
